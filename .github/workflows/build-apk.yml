name: Build Android (APK / AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose build type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk
          - aab

permissions:
  contents: write

jobs:
  build:
    name: Build Android Binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./apps/mobile/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Google services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Setup Release Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/eskool.keystore
            echo "Release keystore restored from secret."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided; using local keystore if present or fallback."
          fi

      - name: Build Android APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' }}
        working-directory: ./apps/mobile/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Build Android AAB
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' }}
        working-directory: ./apps/mobile/android
        run: chmod +x ./gradlew && ./gradlew bundleRelease

      - name: Upload APK Artifact
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: eskool-app-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload AAB Artifact
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: eskool-app-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Publish Binaries to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            gh release upload "$TAG_NAME" "android/app/build/outputs/apk/release/app-release.apk" --clobber
          fi
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            gh release upload "$TAG_NAME" "android/app/build/outputs/bundle/release/app-release.aab" --clobber
          fi
